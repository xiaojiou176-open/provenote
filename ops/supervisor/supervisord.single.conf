; Canonical single-container supervisor profile.
; All log paths in this file must stay under /app/.runtime-cache/runs/current/logs/single-container/.
[supervisord]
nodaemon=true
logfile=/app/.runtime-cache/runs/current/logs/single-container/supervisord.log
logfile_maxbytes=20MB
logfile_backups=10
pidfile=/tmp/supervisord.pid

[program:surrealdb]
command=surreal start --log trace --user root --pass root rocksdb:/mydata/mydatabase.db
stdout_logfile=/app/.runtime-cache/runs/current/logs/single-container/surrealdb.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/app/.runtime-cache/runs/current/logs/single-container/surrealdb.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=5
autostart=true
startsecs=5

[program:api]
command=uv run uvicorn services.api.main:app --host 0.0.0.0 --port 5055
stdout_logfile=/app/.runtime-cache/runs/current/logs/single-container/services.api.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/app/.runtime-cache/runs/current/logs/single-container/services.api.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=10
autostart=true
startsecs=3

[program:worker]
command=uv run surreal-commands-worker --import-modules services.worker
stdout_logfile=/app/.runtime-cache/runs/current/logs/single-container/worker.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/app/.runtime-cache/runs/current/logs/single-container/worker.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=20
autostart=true
startsecs=3

[program:web]
command=bash -c "/app/tooling/scripts/wait-for-api.sh && node start-server.js"
directory=/app/apps/web
environment=NODE_ENV="production",PORT="8502"
passenv=API_URL,NEXT_PUBLIC_API_URL,INTERNAL_API_URL
stdout_logfile=/app/.runtime-cache/runs/current/logs/single-container/apps.web.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/app/.runtime-cache/runs/current/logs/single-container/apps.web.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=30
autostart=true
startsecs=10
