; Legacy non-canonical supervisor profile.
; The /tmp log paths below are implementation details for this profile, not the
; repository log truth source. Canonical single-container logs live under
; /app/.runtime-cache/runs/current/logs/single-container/ and are enforced by
; the runtime governance guards.
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=20MB
logfile_backups=10
pidfile=/tmp/supervisord.pid

[program:api]
command=uv run --no-sync uvicorn services.api.main:app --host 0.0.0.0 --port 5055
stdout_logfile=/tmp/services.api.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/tmp/services.api.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=10
autostart=true

[program:worker]
command=uv run --no-sync surreal-commands-worker --import-modules services.worker
stdout_logfile=/tmp/worker.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/tmp/worker.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=20
autostart=true
startsecs=3

[program:web]
command=bash -c "/app/tooling/scripts/wait-for-api.sh && node start-server.js"
directory=/app/apps/web
environment=NODE_ENV="production",PORT="8502"
passenv=API_URL,NEXT_PUBLIC_API_URL,INTERNAL_API_URL
stdout_logfile=/tmp/apps/web.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/tmp/apps/web.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
autorestart=true
priority=30
autostart=true
startsecs=10
