name: Setup Frontend Node Runtime
description: Install Node.js and apps/web npm dependencies.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "22"
  cache:
    description: Cache mode for setup-node.
    required: false
    default: npm
  cache-dependency-path:
    description: Dependency lock path for npm cache.
    required: false
    default: apps/web/package-lock.json
  working-directory:
    description: Directory where npm ci runs.
    required: false
    default: apps/web

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../../tooling/scripts/ci/with_heartbeat.sh" --label npm-ci --interval 30 -- \
          bash -lc "bash \"${GITHUB_ACTION_PATH}/../../../tooling/scripts/ci/run_with_retry.sh\" --label npm-ci --max-retries 2 -- npm ci"
