      - name: Run mutation testing in repo CI container
        env:
          CI: "1"
        run: |
          bash tooling/scripts/ci/run_in_consistent_container.sh --profile python -- \
            bash -lc 'bash tooling/scripts/ci/with_heartbeat.sh --label mutation-tests --interval 30 -- bash -lc "MUTATION_MIN_SCORE=86 MUTATION_MAX_NO_TESTS=0 MUTATION_MAX_SURVIVED=70 MUTATION_MAX_SKIPPED=0 MUTATION_MAX_SUSPICIOUS=0 MUTATION_MAX_TIMEOUT=0 MUTATION_MAX_SURVIVED_REGRESSION=0 MUTATION_MAX_SCORE_REGRESSION=0 MUTATION_GUARD_REPORT_PATH=mutants/mutation-guard-report.json MUTATION_PROFILE=${MUTATION_PROFILE:-core} MUTATION_MAX_CHILDREN=4 bash tooling/scripts/ci/run_mutation_profile.sh" && bash tooling/scripts/runtime/run_uv_managed.sh run mutmut results | tee mutants/mutmut-results.txt'

      - name: Upload mutation evidence artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
