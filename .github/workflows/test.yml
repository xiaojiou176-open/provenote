      - name: Combine backend coverage and export xml in repo CI container
        env:
          CI: "1"
        run: |
          bash tooling/scripts/ci/run_in_consistent_container.sh --profile python -- \
            bash -lc 'mkdir -p .runtime-cache/test/coverage/backend && bash tooling/scripts/runtime/run_uv_managed.sh run coverage combine --rcfile=pyproject.toml coverage-shard-a/.coverage coverage-shard-b/.coverage && bash tooling/scripts/runtime/run_uv_managed.sh run coverage xml --rcfile=pyproject.toml -o .runtime-cache/test/coverage/backend/coverage.xml'

      - name: Upload backend coverage xml
