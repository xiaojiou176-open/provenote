  required-green-gate:
    name: Required Green Gate
    runs-on: ubuntu-latest
    needs:
      - required-ci-env
      - changes
      - security-scan
      - external-pr-security-scan
      - external-pr-fast-gate
      - governance-gates
      - runtime-policy-gates
      - test-smells
      - backend-lint
      - apps-web-lint
      - backend-shard-a
      - backend-shard-b
      - backend-coverage-merge
      - apps-web
      - coverage-thresholds
      - property-tests
      - post-test-housekeeping
    if: ${{ always() }}
    steps:
      - name: Enforce terminal required-green decision
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EXTERNAL_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          external_pr = os.environ.get("EXTERNAL_PR") == "true"

          if external_pr:
              required_jobs = [
                  "external-pr-security-scan",
                  "external-pr-fast-gate",
              ]
              optional_jobs = {}
              allowed_skipped_jobs = {
                  "required-ci-env",
                  "changes",
                  "security-scan",
                  "governance-gates",
                  "runtime-policy-gates",
                  "test-smells",
                  "backend-lint",
                  "apps-web-lint",
                  "backend-shard-a",
                  "backend-shard-b",
                  "backend-coverage-merge",
                  "apps-web",
                  "coverage-thresholds",
                  "property-tests",
                  "post-test-housekeeping",
              }
          else:
              required_jobs = [
                  "changes",
                  "security-scan",
                  "governance-gates",
                  "runtime-policy-gates",
                  "test-smells",
                  "backend-lint",
                  "apps-web-lint",
                  "backend-shard-a",
                  "backend-shard-b",
                  "backend-coverage-merge",
                  "apps-web",
                  "coverage-thresholds",
                  "post-test-housekeeping",
              ]
              optional_jobs = {
                  "property-tests": "property_tests",
              }
              allowed_skipped_jobs = {
                  "external-pr-security-scan",
                  "external-pr-fast-gate",
              }

          def job_result(name: str) -> str:
              return (needs.get(name) or {}).get("result", "missing")

          for job in required_jobs:
              result = job_result(job)
              print(f"[required] {job}: {result}")
              if result != "success":
                  failures.append(f"{job} must be success, got {result}")

          changes_outputs = (needs.get("changes") or {}).get("outputs") or {}
          for job, output_key in optional_jobs.items():
              expected = changes_outputs.get(output_key) == "true"
              result = job_result(job)
              print(f"[conditional] {job}: result={result}, expected={expected} (changes.{output_key}={changes_outputs.get(output_key)})")
              if expected and result != "success":
                  failures.append(f"{job} expected to run and succeed because changes.{output_key}=true, got {result}")
              if not expected and result not in ("skipped", "success"):
                  failures.append(f"{job} not expected to run; only skipped/success allowed, got {result}")

          for job in sorted(allowed_skipped_jobs):
              result = job_result(job)
              print(f"[allowed-skip] {job}: {result}")
              if result not in ("skipped", "success"):
                  failures.append(f"{job} should resolve to skipped/success for this event, got {result}")

          if failures:
              print("\nRequired green gate failed:")
              for line in failures:
                  print(f"- {line}")
              sys.exit(1)

          print("\nRequired green gate passed.")
          PY
