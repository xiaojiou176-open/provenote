  e2e:
    name: Frontend E2E (Chromium) (Shard ${{ matrix.shard }})
    needs: [required-ci-env, changes]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/6"
            shard_id: "1-of-6"
            playwright_port: "3111"
            playwright_api_port: "5111"
          - shard: "2/6"
            shard_id: "2-of-6"
            playwright_port: "3112"
            playwright_api_port: "5112"
          - shard: "3/6"
            shard_id: "3-of-6"
            playwright_port: "3113"
            playwright_api_port: "5113"
          - shard: "4/6"
            shard_id: "4-of-6"
            playwright_port: "3114"
            playwright_api_port: "5114"
          - shard: "5/6"
            shard_id: "5-of-6"
            playwright_port: "3115"
            playwright_api_port: "5115"
          - shard: "6/6"
            shard_id: "6-of-6"
            playwright_port: "3116"
            playwright_api_port: "5116"
    steps:
      - name: Pre-clean workspace (git hygiene)
        run: |
          # Prevent stale refs and checkout residue from earlier workflow steps.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run E2E tests (Chromium) in consistent container
        env:
          CI: "1"
          PLAYWRIGHT_PORT: ${{ matrix.playwright_port }}
          PLAYWRIGHT_API_PORT: ${{ matrix.playwright_api_port }}
          PLAYWRIGHT_DISABLE_VISUAL_BASELINES: "0"
          PLAYWRIGHT_DISABLE_COLOR_CONTRAST_CHECK: "0"
        run: |
          bash tooling/scripts/ci/run_in_consistent_container.sh --profile apps/web -- \
            bash -lc 'cd apps/web && bash ../tooling/scripts/ci/with_heartbeat.sh --label e2e-chromium --interval 30 -- bash -lc "bash ../tooling/scripts/ci/run_with_retry.sh --label e2e-chromium --max-retries 1 -- npm run test:e2e -- --project=chromium --workers=6 --shard=${{ matrix.shard }}"'

      - name: Upload retry classification logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-retry-logs-e2e-chromium-${{ matrix.shard_id }}
          path: .runtime-cache/runs/current/reports/test-retry/*.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report-${{ matrix.shard_id }}
          path: .runtime-cache/runs/current/evidence/playwright/report
          if-no-files-found: error

