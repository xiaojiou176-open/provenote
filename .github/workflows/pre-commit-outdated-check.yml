name: Pre-commit Outdated Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pre-commit-outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Check pre-commit hooks are up to date (dry-run)
        run: |
          if pre-commit autoupdate --help 2>/dev/null | grep -q -- '--dry-run'; then
            pre-commit autoupdate --freeze --bleeding-edge --dry-run
          else
            echo 'pre-commit version lacks --dry-run, skipping outdated check'
          fi
