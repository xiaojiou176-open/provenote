name: JSCPD Duplication Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jscpd-duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run jscpd duplication scan in repo CI container
        env:
          CI: "1"
        run: |
          bash tooling/scripts/ci/run_in_consistent_container.sh --profile minimal -- \
            bash -lc 'npx --yes jscpd@4.0.8 services packages tooling apps/web/src --threshold 3 --silent --min-lines 20 --min-tokens 100 --pattern "**/*.{ts,tsx,js,jsx,py}" --ignore "**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/coverage/**,**/mutants/**,**/tests/**,**/__tests__/**"'
