[project]
name = "notebooklab"
version = "1.7.4"
description = "An open source implementation of a research assistant, inspired by Google Notebook LM"
authors = [
    {name = "Luis Novo"}
]
# Original upstream author metadata is preserved for provenance and license continuity.
# Current fork stewardship metadata is declared below under [tool.open_notebook.public_identity].
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "fastmcp>=2.12.3",
    "uvicorn>=0.24.0",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "langchain>=1.2.0",
    "langgraph>=1.0.5",
    "tiktoken>=0.12.0",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain-community>=0.4.1",
    "google-genai>=1.60.0,<2",
    "langchain-google-genai>=4.1.2",
    "tomli>=2.0.2",
    "python-dotenv>=1.0.1",
    "httpx[socks]>=0.27.0",
    "content-core>=1.14.1,<2",
    "ai-prompter>=0.3,<1",
    "esperanto>=2.19.3,<3",
    "surrealdb>=1.0.4",
    "podcast-creator>=0.11.2,<1",
    "surreal-commands>=1.3.1,<2",
    "numpy>=2.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]


[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "hypothesis>=6.130.4",
    "mutmut>=3.3.1",
    "ruff>=0.5.5",
    "mypy>=1.11.1",
    "types-requests>=2.32.0.20241016",
    "types-PyYAML",
    "ipywidgets>=8.1.5",
    "pre-commit>=4.0.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=5.1.0",
]

[project.scripts]
notebooklab-mcp = "packages.core.mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    "pillow>=12.1.1,<13",
]

[dependency-groups]
dev = [
    "hypothesis>=6.130.4",
    "mutmut>=3.3.1",
    "pre-commit>=4.1.0",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.13",
    "types-PyYAML",
    "types-requests>=2.32.4.20250913",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
fix = true
cache-dir = ".runtime-cache/local/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "TRY", "LOG", "G"]
ignore = [
    "ANN",   # temporarily relax annotation strictness for legacy code
    "D",     # temporarily relax docstring coverage for legacy code
    "COM812",  # formatter-compatible trailing comma handling
    "ISC001",  # formatter-compatible implicit string concatenation handling
    "E501",  # line too long
    "E402",  # module level import not at top of file (Streamlit requires this pattern)
    "E722",  # do not use bare except (legacy code pattern)
    "F401",  # imported but unused (may be used in type hints or re-exports)
    "F541",  # f-string without placeholders
    "F841",  # local variable assigned but never used
    "TRY003",  # raise-vanilla-args (legacy baseline)
    "TRY301",  # raise-within-try (legacy baseline)
    "TRY300",  # try-consider-else (legacy baseline)
    "TRY004",  # type-check-without-type-error (legacy baseline)
    "G004",  # logging-f-string (legacy baseline)
]

[tool.ruff.lint.per-file-ignores]
# Streamlit files need nest_asyncio.apply() before imports
"app_home.py" = ["E402"]
"pages/**/*.py" = ["E402"]

[tool.mypy]
cache_dir = ".runtime-cache/local/mypy-cache"
# Exclude Streamlit UI pages from type checking
[[tool.mypy.overrides]]
module = "pages.*"
ignore_errors = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.coverage.run]
relative_files = true

[tool.coverage.paths]
repo = [
    ".",
]

[tool.mutmut]
paths_to_mutate = [
    "packages/core/utils/chunking.py",
    "packages/core/utils/text_utils.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_chunking.py",
    "tests/test_text_utils_mutation.py",
    "tests/test_mutation_survivor_killers_runtime.py",
]
also_copy = ["packages/core/settings.py", "packages/core/utils/encryption.py", "api"]
do_not_mutate = ["*/site-packages/*", "*/tests/*"]
[tool.open_notebook.mutation_profiles]
default = "core"

[tool.open_notebook.mutation_profiles.core]
paths_to_mutate = [
    "packages/core/utils/chunking.py",
    "packages/core/utils/text_utils.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_chunking.py",
    "tests/test_text_utils_mutation.py",
]

[tool.open_notebook.mutation_profiles.extended]
paths_to_mutate = [
    "packages/core/utils/chunking.py",
    "packages/core/utils/text_utils.py",
    "services/api/auth.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_chunking.py",
    "tests/test_text_utils_mutation.py",
    "tests/api/test_auth_fail_closed.py",
]

[tool.open_notebook.public_identity]
stewardship_notice = "Current fork public stewardship is repo-local; see MAINTAINERS.md and NOTICE.md."
upstream_provenance = "This checkout inherits from the upstream Open Notebook project; original author metadata remains intact for provenance."
canonical_public_surface = "No off-repo canonical public URL is declared in-tree for this fork; use repo-local docs plus repository GitHub tabs."

[tool.pytest.ini_options]
cache_dir = ".runtime-cache/test/pytest_cache"
addopts = [
    "--benchmark-storage=.runtime-cache/test/benchmarks",
]
markers = [
    "property: property-based tests (Hypothesis)",
    "live: live integration tests that call real external services",
]
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated, use ConfigDict instead\\.:pydantic.warnings.PydanticDeprecatedSince20:surreal_commands\\.core\\.retry",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
