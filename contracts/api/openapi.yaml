openapi: 3.1.0
info:
  title: Notebooklab API
  description: API for Notebooklab, a source-grounded and auditable research workbench.
  version: 0.1.0
paths:
  /api/auth/status:
    get:
      tags:
      - auth
      - auth
      summary: Get Auth Status
      description: 'Check if authentication is enabled.

        Returns whether a password is required to access the API.

        Supports Docker secrets via OPEN_NOTEBOOK_PASSWORD_FILE.'
      operationId: get_auth_status_api_auth_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/config:
    get:
      tags:
      - config
      summary: Get Config
      description: 'Get frontend configuration.


        Returns version information and health status.

        Note: The frontend determines the API URL via its own runtime-config endpoint,

        so this endpoint no longer returns apiUrl.


        Also checks for version updates from GitHub (with caching and error handling).'
      operationId: get_config_api_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/notebooks:
    get:
      tags:
      - notebooks
      summary: Get Notebooks
      description: Get all notebooks with optional filtering and ordering.
      operationId: get_notebooks_api_notebooks_get
      parameters:
      - name: archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by archived status
          title: Archived
        description: Filter by archived status
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          description: Order by field and direction
          default: updated desc
          title: Order By
        description: Order by field and direction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotebookResponse'
                title: Response Get Notebooks Api Notebooks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - notebooks
      summary: Create Notebook
      description: Create a new notebook.
      operationId: create_notebook_api_notebooks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notebooks/{notebook_id}/delete-preview:
    get:
      tags:
      - notebooks
      summary: Get Notebook Delete Preview
      description: Get a preview of what will be deleted when this notebook is deleted.
      operationId: get_notebook_delete_preview_api_notebooks__notebook_id__delete_preview_get
      parameters:
      - name: notebook_id
        in: path
        required: true
        schema:
          type: string
          title: Notebook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookDeletePreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notebooks/{notebook_id}:
    get:
      tags:
      - notebooks
      summary: Get Notebook
      description: Get a specific notebook by ID.
      operationId: get_notebook_api_notebooks__notebook_id__get
      parameters:
      - name: notebook_id
        in: path
        required: true
        schema:
          type: string
          title: Notebook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - notebooks
      summary: Update Notebook
      description: Update a notebook.
      operationId: update_notebook_api_notebooks__notebook_id__put
      parameters:
      - name: notebook_id
        in: path
        required: true
        schema:
          type: string
          title: Notebook Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - notebooks
      summary: Delete Notebook
      description: 'Delete a notebook with cascade deletion.


        Always deletes all notes associated with the notebook.

        If delete_exclusive_sources is True, also deletes sources that belong only

        to this notebook (not linked to any other notebooks).'
      operationId: delete_notebook_api_notebooks__notebook_id__delete
      parameters:
      - name: notebook_id
        in: path
        required: true
        schema:
          type: string
          title: Notebook Id
      - name: delete_exclusive_sources
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to delete sources that belong only to this notebook
          default: false
          title: Delete Exclusive Sources
        description: Whether to delete sources that belong only to this notebook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notebooks/{notebook_id}/sources/{source_id}:
    post:
      tags:
      - notebooks
      summary: Add Source To Notebook
      description: Add an existing source to a notebook (create the reference).
      operationId: add_source_to_notebook_api_notebooks__notebook_id__sources__source_id__post
      parameters:
      - name: notebook_id
        in: path
        required: true
        schema:
          type: string
          title: Notebook Id
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - notebooks
      summary: Remove Source From Notebook
      description: Remove a source from a notebook (delete the reference).
      operationId: remove_source_from_notebook_api_notebooks__notebook_id__sources__source_id__delete
      parameters:
      - name: notebook_id
        in: path
        required: true
        schema:
          type: string
          title: Notebook Id
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/search:
    post:
      tags:
      - search
      summary: Search Knowledge Base
      description: Search the knowledge base using text or vector search.
      operationId: search_knowledge_base_api_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/search/ask:
    post:
      tags:
      - search
      summary: Ask Knowledge Base
      description: Ask the knowledge base a question using AI models.
      operationId: ask_knowledge_base_api_search_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/search/ask/simple:
    post:
      tags:
      - search
      summary: Ask Knowledge Base Simple
      description: Ask the knowledge base a question and return a simple response (non-streaming).
      operationId: ask_knowledge_base_simple_api_search_ask_simple_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models:
    get:
      tags:
      - models
      summary: Get Models
      description: Get all configured models with optional type filtering.
      operationId: get_models_api_models_get
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by model type
          title: Type
        description: Filter by model type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelResponse'
                title: Response Get Models Api Models Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - models
      summary: Create Model
      description: Create a new model configuration.
      operationId: create_model_api_models_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/{model_id}:
    delete:
      tags:
      - models
      summary: Delete Model
      description: Delete a model configuration.
      operationId: delete_model_api_models__model_id__delete
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/{model_id}/test:
    post:
      tags:
      - models
      summary: Test Model
      description: Test if a specific model is correctly configured and functional.
      operationId: test_model_api_models__model_id__test_post
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/defaults:
    get:
      tags:
      - models
      summary: Get Default Models
      description: Get default model assignments.
      operationId: get_default_models_api_models_defaults_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultModelsResponse'
    put:
      tags:
      - models
      summary: Update Default Models
      description: Update default model assignments.
      operationId: update_default_models_api_models_defaults_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultModelsResponse'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultModelsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/providers:
    get:
      tags:
      - models
      summary: Get Provider Availability
      description: Get provider availability based on database credentials only.
      operationId: get_provider_availability_api_models_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAvailabilityResponse'
  /api/models/discover/{provider}:
    get:
      tags:
      - models
      summary: Discover Models
      description: 'Discover available models from a provider without registering them.


        This endpoint queries the provider''s API to list available models

        but does not save them to the database. Use the sync endpoint

        to both discover and register models.'
      operationId: discover_models_api_models_discover__provider__get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderDiscoveredModelResponse'
                title: Response Discover Models Api Models Discover  Provider  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/sync/{provider}:
    post:
      tags:
      - models
      summary: Sync Models
      description: 'Sync models for a specific provider.


        Discovers available models from the provider''s API and registers

        any new models in the database. Existing models are skipped.


        Returns counts of discovered, new, and existing models.'
      operationId: sync_models_api_models_sync__provider__post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/sync:
    post:
      tags:
      - models
      summary: Sync All Models
      description: 'Sync models for all configured providers.


        Discovers and registers models from all providers that have

        valid API keys configured. This is useful for initial setup

        or periodic refresh of available models.'
      operationId: sync_all_models_api_models_sync_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllProvidersSyncResponse'
  /api/models/count/{provider}:
    get:
      tags:
      - models
      summary: Get Model Count
      description: 'Get count of registered models for a provider, grouped by type.


        Returns counts for each model type (language, embedding,

        speech_to_text, text_to_speech) as well as total count.'
      operationId: get_model_count_api_models_count__provider__get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelCountResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/by-provider/{provider}:
    get:
      tags:
      - models
      summary: Get Models By Provider
      description: 'Get all registered models for a specific provider.


        Returns models from the database that belong to the specified provider.'
      operationId: get_models_by_provider_api_models_by_provider__provider__get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelResponse'
                title: Response Get Models By Provider Api Models By Provider  Provider  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/models/auto-assign:
    post:
      tags:
      - models
      summary: Auto Assign Defaults
      description: "Auto-assign default models based on Gemini slot policy.\n\nReturns:\n    - assigned: Dict of slot names\
        \ to assigned model IDs\n    - skipped: List of slots that already have models assigned\n    - missing: List of slots\
        \ with no available models"
      operationId: auto_assign_defaults_api_models_auto_assign_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAssignResult'
  /api/transformations:
    get:
      tags:
      - transformations
      summary: Get Transformations
      description: Get all transformations.
      operationId: get_transformations_api_transformations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TransformationResponse'
                type: array
                title: Response Get Transformations Api Transformations Get
    post:
      tags:
      - transformations
      summary: Create Transformation
      description: Create a new transformation.
      operationId: create_transformation_api_transformations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/transformations/execute:
    post:
      tags:
      - transformations
      summary: Execute Transformation
      description: Execute a transformation on input text.
      operationId: execute_transformation_api_transformations_execute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationExecuteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationExecuteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/transformations/default-prompt:
    get:
      tags:
      - transformations
      summary: Get Default Prompt
      description: Get the default transformation prompt.
      operationId: get_default_prompt_api_transformations_default_prompt_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPromptResponse'
    put:
      tags:
      - transformations
      summary: Update Default Prompt
      description: Update the default transformation prompt.
      operationId: update_default_prompt_api_transformations_default_prompt_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultPromptUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPromptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/transformations/{transformation_id}:
    get:
      tags:
      - transformations
      summary: Get Transformation
      description: Get a specific transformation by ID.
      operationId: get_transformation_api_transformations__transformation_id__get
      parameters:
      - name: transformation_id
        in: path
        required: true
        schema:
          type: string
          title: Transformation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - transformations
      summary: Update Transformation
      description: Update a transformation.
      operationId: update_transformation_api_transformations__transformation_id__put
      parameters:
      - name: transformation_id
        in: path
        required: true
        schema:
          type: string
          title: Transformation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - transformations
      summary: Delete Transformation
      description: Delete a transformation.
      operationId: delete_transformation_api_transformations__transformation_id__delete
      parameters:
      - name: transformation_id
        in: path
        required: true
        schema:
          type: string
          title: Transformation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notes:
    get:
      tags:
      - notes
      summary: Get Notes
      description: Get all notes with optional notebook filtering.
      operationId: get_notes_api_notes_get
      parameters:
      - name: notebook_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by notebook ID
          title: Notebook Id
        description: Filter by notebook ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteResponse'
                title: Response Get Notes Api Notes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - notes
      summary: Create Note
      description: Create a new note.
      operationId: create_note_api_notes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notes/{note_id}:
    get:
      tags:
      - notes
      summary: Get Note
      description: Get a specific note by ID.
      operationId: get_note_api_notes__note_id__get
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
          title: Note Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - notes
      summary: Update Note
      description: Update a note.
      operationId: update_note_api_notes__note_id__put
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
          title: Note Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - notes
      summary: Delete Note
      description: Delete a note.
