schemaVersion: "1.0.0"
kind: host_packet
id: notebooklab-openclaw-cursor-bundle
name: Notebooklab outcome bundle
description: Public-ready OpenClaw-compatible Cursor-style bundle for read-first Notebooklab MCP workflows.
version: "1.8.5"
license: MIT
homepage: https://github.com/xiaojiou176-open/notebooklab/tree/main/examples/hosts/openclaw/notebooklab-cursor-bundle
repository:
  type: git
  url: git+https://github.com/xiaojiou176-open/notebooklab.git
  directory: examples/hosts/openclaw/notebooklab-cursor-bundle
supportTier: public-ready package available
publicationStatus: repo_owned_packet_not_listed
host: OpenClaw (Cursor-style)
placement:
  relativePath: examples/hosts/openclaw/notebooklab-cursor-bundle/README.md
  discoveryRoots:
    - .cursor-plugin/plugin.json
    - .mcp.json
packetArtifacts:
  - README.md
  - .cursor-plugin/plugin.json
  - .mcp.json
capabilities:
  - notebooklab.list_drafts
  - notebooklab.list_research_threads
  - notebooklab.list_auditable_runs
  - notebooklab.research_thread.to_draft
  - notebooklab.draft.verify
smoke:
  path: README.md
  minimalFlow:
    - Confirm notebooklab-mcp is installed and reachable.
    - Register the Cursor-style bundle with OpenClaw.
    - Run one read-first MCP action such as listing drafts or research threads.
  preferredFlow:
    - Convert one research thread into a draft.
    - Verify the draft before downloading the outcome.
claimBoundary: This packet is repo-owned install truth only and does not claim a live official OpenClaw or ClawHub listing.
