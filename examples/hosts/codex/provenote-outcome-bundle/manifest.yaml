schemaVersion: "1.0.0"
kind: host_packet
id: provenote-codex-outcome-bundle
name: Provenote outcome bundle
description: Public-ready Codex starter bundle for read-first Provenote MCP workflows.
version: "1.8.5"
license: MIT
homepage: https://github.com/xiaojiou176-open/provenote/tree/main/examples/hosts/codex/provenote-outcome-bundle
repository:
  type: git
  url: git+https://github.com/xiaojiou176-open/provenote.git
  directory: examples/hosts/codex/provenote-outcome-bundle
supportTier: public-ready package available
publicationStatus: repo_owned_packet_not_listed
host: OpenAI Codex
placement:
  relativePath: examples/hosts/codex/provenote-outcome-bundle/README.md
  discoveryRoots:
    - .codex-plugin/plugin.json
    - .mcp.json
    - config.toml.example
packetArtifacts:
  - README.md
  - .codex-plugin/plugin.json
  - .mcp.json
  - config.toml.example
capabilities:
  - provenote.list_drafts
  - provenote.list_research_threads
  - provenote.list_auditable_runs
  - provenote.research_thread.to_draft
  - provenote.draft.verify
smoke:
  path: README.md
  minimalFlow:
    - Confirm provenote-mcp is installed and reachable.
    - Register the bundle-local .mcp.json with Codex.
    - Run one read-first MCP action such as listing drafts or auditable runs.
  preferredFlow:
    - Convert one research thread into a draft.
    - Verify the draft before downloading the outcome.
claimBoundary: This packet is repo-owned install truth only and does not claim a live official plugin directory or marketplace listing.
