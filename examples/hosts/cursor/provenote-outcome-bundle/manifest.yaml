schemaVersion: "1.0.0"
kind: host_packet
id: notebooklab-cursor-outcome-bundle
name: Notebooklab outcome bundle
description: Public-ready Cursor starter bundle for read-first Notebooklab MCP workflows.
version: "1.8.5"
license: MIT
homepage: https://github.com/xiaojiou176-open/notebooklab/tree/main/examples/hosts/cursor/notebooklab-outcome-bundle
repository:
  type: git
  url: git+https://github.com/xiaojiou176-open/notebooklab.git
  directory: examples/hosts/cursor/notebooklab-outcome-bundle
supportTier: public-ready package available
publicationStatus: repo_owned_packet_not_listed
host: Cursor
placement:
  relativePath: examples/hosts/cursor/notebooklab-outcome-bundle/README.md
  discoveryRoots:
    - .mcp.json
    - .cursor/commands
packetArtifacts:
  - README.md
  - .mcp.json
  - .cursor/commands
capabilities:
  - notebooklab.list_drafts
  - notebooklab.list_research_threads
  - notebooklab.list_auditable_runs
  - notebooklab.research_thread.to_draft
  - notebooklab.draft.verify
smoke:
  path: README.md
  minimalFlow:
    - Confirm notebooklab-mcp is installed and reachable.
    - Register the bundle-local .mcp.json with Cursor.
    - Run one read-first MCP action such as listing drafts or research threads.
  preferredFlow:
    - Convert one research thread into a draft.
    - Verify the draft before downloading the outcome.
claimBoundary: This packet is repo-owned install truth only and does not claim a live official marketplace or directory listing.
