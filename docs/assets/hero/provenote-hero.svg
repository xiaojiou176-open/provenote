  <text x="110" y="426" fill="#C3D5E5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">Search, transform, and organize them in one workbench.</text>
  <text x="110" y="460" fill="#C3D5E5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">Export inspectable reports when traceability matters.</text>

