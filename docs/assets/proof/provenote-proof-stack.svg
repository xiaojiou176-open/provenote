<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="520" rx="28" fill="#08121D"/>
  <rect x="36" y="36" width="1128" height="448" rx="24" fill="#0F1E2D" stroke="#203A50"/>

  <text x="70" y="96" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">Public proof should be front-stage.</text>
  <text x="70" y="132" fill="#A8BFD5" font-family="Arial, Helvetica, sans-serif" font-size="18">Provenote moves evidence from buried implementation details into linkable public surfaces.</text>

  <rect x="70" y="184" width="248" height="244" rx="22" fill="#13273B"/>
  <text x="96" y="224" fill="#36CFC9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">01 PRODUCT PROOF</text>
  <text x="96" y="262" fill="#F6FBFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">Auditable output lane</text>
  <text x="96" y="298" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">README, quickstart, proof page,</text>
  <text x="96" y="322" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">UI component, and API route</text>
  <text x="96" y="366" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15">Can I see the thing?</text>

  <rect x="336" y="184" width="248" height="244" rx="22" fill="#12283D"/>
  <text x="362" y="224" fill="#5BA7FF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">02 WORKFLOW PROOF</text>
  <text x="362" y="262" fill="#F6FBFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">Visible release memory</text>
  <text x="362" y="298" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">Changelog, releases, tags,</text>
  <text x="362" y="322" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">and issue or discussion routes</text>
  <text x="362" y="366" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15">Is this moving?</text>

  <rect x="602" y="184" width="248" height="244" rx="22" fill="#13273B"/>
  <text x="628" y="224" fill="#F3C969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">03 TRUST PROOF</text>
  <text x="628" y="262" fill="#F6FBFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">Open repo boundaries</text>
  <text x="628" y="298" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">Security, support, license,</text>
  <text x="628" y="322" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">maintainers, and provenance</text>
  <text x="628" y="366" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15">Can I trust the boundary?</text>

  <rect x="854" y="184" width="236" height="244" rx="22" fill="#12283D"/>
  <text x="878" y="224" fill="#FF8E72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">04 GROWTH PROOF</text>
  <text x="878" y="262" fill="#F6FBFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">Shareable public assets</text>
  <text x="878" y="298" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">Hero image, social preview,</text>
  <text x="878" y="322" fill="#B8CCDE" font-family="Arial, Helvetica, sans-serif" font-size="15">docs entry, and proof visual</text>
  <text x="878" y="366" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15">Would I share this?</text>
</svg>
