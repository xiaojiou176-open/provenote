[mypy]
# Only check for syntax errors, not type errors
# This allows the codebase to gradually add type hints
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_implicit_optional = False

check_untyped_defs = True
explicit_package_bases = True
mypy_path = .
cache_dir = .runtime-cache/local/mypy-cache

# Disable type checking for files with many errors
[mypy-services.api.client]
ignore_errors = True

[mypy-services.api.podcast_api_service]
ignore_errors = True

[mypy-services.api.auth]
ignore_errors = True

[mypy-services.api.routers.models]
ignore_errors = True

[mypy-packages.core.domain.base]
ignore_errors = True

[mypy-packages.core.domain.notebook]
ignore_errors = True

[mypy-packages.core.graphs.transformation]
ignore_errors = True

[mypy-packages.core.graphs.ask]
ignore_errors = True
